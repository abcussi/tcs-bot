[project]
name = "gfinance-crawler"
version = "0.1.0"
description = "Google Finance scraper that indexes market data into Elasticsearch on a cron schedule"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=8.15,<9",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[project.scripts]
gfinance-crawl = "gfinance_crawler.run:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
