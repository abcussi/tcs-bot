name: tcs-bot

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vendor_risk}
      MYSQL_USER: ${MYSQL_USER:-vendor_risk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vendor_risk_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pw}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_pw}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      retries: 30

  api:
    build: { context: ., dockerfile: Dockerfile }
    profiles: ["app"]
    env_file: .env
    restart: on-failure
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      ELASTIC_URL: http://elasticsearch:9200
    ports: ["8000:8000"]
    volumes: [gold_data:/app/data/gold]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  medallion:
    # TCS risk pipeline on a schedule: crawl -> bronze (MySQL) -> silver (ES) -> gold (ES kNN vectors + graph)
    build: { context: ., dockerfile: Dockerfile }
    profiles: ["app"]
    env_file: .env
    restart: on-failure
    command: ["tcs-bot", "medallion", "schedule", "--cron", "0 */6 * * *"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      ELASTIC_URL: http://elasticsearch:9200
    volumes: [gold_data:/app/data/gold]
    depends_on:
      mysql: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  crawler:
    build: { context: ., dockerfile: crawler/Dockerfile }
    profiles: ["app"]
    env_file: .env
    restart: on-failure
    environment:
      ELASTIC_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch: { condition: service_healthy }

volumes:
  gold_data:
  mysql_data:
  es_data:
