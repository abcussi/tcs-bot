[project]
name = "vendor-risk-ai"
version = "0.1.0"
description = "AI-based vendor risk assessment report generator for capital markets (FastAPI + LCEL + MCP)"
authors = [{ name = "Angel Benjamin Cussi" }]
requires-python = ">=3.13"
dependencies = [
    "elasticsearch>=8.15,<9",
    "fastapi>=0.162.0",
    "gfinance-crawler",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "mcp>=2.3.0",
    "mysql-connector-python>=9",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "redis>=5",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vendor-risk-ai = "vendor_risk_ai.main:cli"
vendor-risk-mcp = "vendor_risk_ai.mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["crawler"]

[tool.uv.sources]
gfinance-crawler = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests", "crawler/tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs live MySQL / Redis / Elasticsearch (docker compose up)",
  "e2e: full HTTP flow through the running stack",
]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
